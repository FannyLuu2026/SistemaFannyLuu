  if(!F.items.length)return `<div class="carro vacio">${cab}<p class="hint" style="text-align:center;margin:18px 0 6px">Buscá un artículo, elegí la cantidad y tocá <b>Agregar al carrito</b>.</p></div>`;
  const listo=F.mix?!mixMsg():F.metodo&&(F.metodo==='efectivo'||F.banco)&&F.moneda&&(F.metodo!=='transferencia'||F.ref.trim().length>=4)&&pagoOK();
  return `<div class="carro">${cab}
   ${F.items.map((i,k)=>{const p=S.productos.get(i.pid);const disp=p?stockDe(p):0;const falta=i.cant>disp;
    return `<div class="cline"><div class="cl-i"><b>${esc(i.nombre)}</b><small class="num">${fmt(i.precio)} c/u · ${esc(i.unidad)}</small>${falta?`<small class="neg">Solo hay ${disp} en existencia</small>`:''}</div>
    <div class="qty sm"><button type="button" data-fdec="${k}" aria-label="Quitar uno">−</button><span class="num">${i.cant}</span><button type="button" data-finc="${k}" aria-label="Agregar uno">+</button></div>
    <div class="cl-t"><b class="num">${fmt(i.precio*i.cant)}</b><button type="button" class="cl-x" data-fdel="${k}">Quitar</button></div></div>`}).join('')}
   <div class="ftot"><span>Total</span><div><b class="num">${fmt(tot)}</b><small class="num">${fmtUSD(tot/tc)}</small></div></div>
   <div class="tasa"><span>Tasa de cambio</span><b class="num">US$1.00 = ${fmt(tc)}</b></div></div>
  <h3>Cliente <span class="opc">opcional</span></h3>
  <div class="card cli" style="padding:14px"><div class="fpar"><label class="f">Nombre del cliente<input id="facCliNom" value="${esc(F.cliNom)}" maxlength="60" autocapitalize="words" placeholder="Ej: María Pérez"></label><label class="f">Teléfono<input id="facCliTel" value="${esc(F.cliTel)}" maxlength="15" inputmode="tel" placeholder="Ej: 8888-8888"></label></div>
   <div class="plist" id="cliSug" hidden></div><p class="hint" style="margin:8px 0 0">Si el cliente no quiere dar sus datos, dejalo en blanco.</p></div>
  <h3>Método de pago</h3>
  ${F.mix?vMix():pagoSimple(F,tot,tc)}
  <div class="actions"><button type="button" class="btn primary big" data-faccobrar ${listo?'':'disabled'} style="flex:1">Facturar ${!F.mix&&F.moneda==='USD'?fmtUSD(tot/tc):fmt(tot)}</button></div>
  ${!listo?`<p class="hint" id="facHint" style="text-align:right;margin:6px 0 0">${F.mix?esc(mixMsg()):!F.metodo?'Elegí el método de pago.':F.metodo==='transferencia'&&!F.banco?'Elegí el banco.':!F.moneda?'Elegí la moneda.':F.metodo==='efectivo'?'Revisá con cuánto paga el cliente.':'Escribí la referencia de la transferencia.'}</p>`:''}`;
}
function pagoSimple(F,tot,tc){return `  <div class="paygrid"><button type="button" class="pay" data-metodo="efectivo" aria-pressed="${F.metodo==='efectivo'}"><span class="pi">${ICON.efectivo}</span><b>Efectivo</b></button><button type="button" class="pay" data-metodo="transferencia" aria-pressed="${F.metodo==='transferencia'}"><span class="pi">${ICON.transfer}</span><b>Transferencia</b></button></div>
  ${F.metodo==='transferencia'?`<p class="lbl" style="margin-top:16px">Banco</p><div class="bancos">${BANCOS.map(([k,l])=>`<button type="button" class="banco b-${k.toLowerCase()}" data-banco="${k}" aria-pressed="${F.banco===k}">${l}</button>`).join('')}</div>`:''}
  ${F.metodo&&(F.metodo==='efectivo'||F.banco)?`<p class="lbl" style="margin-top:16px">Moneda</p><div class="seg2 mon"><button type="button" data-moneda="NIO" aria-pressed="${F.moneda==='NIO'}"><b>Córdobas</b><small class="num">${fmt(tot)}</small></button><button type="button" data-moneda="USD" aria-pressed="${F.moneda==='USD'}"><b>Dólares</b><small class="num">${fmtUSD(tot/tc)} · T/C ${tc.toFixed(2)}</small></button></div>`:''}
  ${F.metodo==='efectivo'&&F.moneda?`<div class="pagacon"><label class="f">Paga con ${F.moneda==='USD'?'(dólares)':'(córdobas)'} ${F.moneda==='USD'?'<span class="req">obligatorio</span>':'<span class="opc">opcional</span>'}<div class="waf"><span class="num">${F.moneda==='USD'?'US$':'C$'}</span><input id="facRec" inputmode="decimal" value="${esc(F.rec||'')}" placeholder="${F.moneda==='USD'?(Math.ceil(facTotal()/tcDe())):Math.ceil(facTotal())}"></div></label>
   <div class="calc" id="facCambio">${htmlCambio()}</div></div>`:''}
  ${F.metodo==='transferencia'&&F.banco&&F.moneda?`<label class="f" style="margin-top:16px">Referencia de la transferencia <span class="req">obligatorio</span><input id="facRef" value="${esc(F.ref)}" maxlength="40" autocapitalize="characters" placeholder="Número de referencia o comprobante"></label>`:''}
  <button type="button" class="btn ghost" data-mixon style="width:100%;margin-top:14px">+ Pago mixto (dos o más formas de pago)</button>`}
function refrescarFac(){const d=$('#facDyn');if(!d)return;const a=document.activeElement;const id=a&&d.contains(a)&&a.id;let pos=null;try{pos=id?a.selectionStart:null}catch(e){}
  d.innerHTML=facDyn();if(id){const r=document.getElementById(id);if(r){r.focus();try{if(pos!=null)r.setSelectionRange(pos,pos)}catch(e){}}}}
function sugerirCliente(v){const box=$('#cliSug');if(!box)return;const t=v.trim().toLowerCase(),td=soloDig(v);if(t.length<2){box.hidden=true;return}
  const l=Object.entries(S.clientes).map(([id,c])=>({id,...c})).filter(c=>(c.nombre||'').toLowerCase().includes(t)||(td.length>=3&&soloDig(c.telefono).includes(td))).sort((a,b)=>(b.ultima||0)-(a.ultima||0)).slice(0,6);
  if(!l.length){box.hidden=true;return}box.hidden=false;
  box.innerHTML=l.map(c=>`<button type="button" data-clipick="${esc(c.id)}"><span>${esc(c.nombre||'Sin nombre')}<small class="num">${esc(telFmt(c.telefono)||'Sin teléfono')}</small></span><span class="hint" style="font-size:12px">Cliente frecuente</span></button>`).join('')}
function montarFacturar(){const f=$('#facf');if(!f||f.dataset.b)return;f.dataset.b=1;let sel=null;
  const err=$('#facErr');const cant=$('#facCant');
  const getC=()=>Math.max(0,parseInt(soloDig(cant.value),10)||0);
  const bind=()=>bindSelector($('#facSel'),p=>{sel=p;err.hidden=true;if(p){cant.value='1';setTimeout(()=>{cant.focus();cant.select()},50)}});
  bind();
  const agregar=()=>{const c=getC();
    if(!sel){err.textContent='Buscá y elegí un artículo.';err.hidden=false;return}
    if(!(c>0)){err.textContent='Escribí una cantidad mayor que cero.';err.hidden=false;return}
    const p=S.productos.get(sel.id);const disp=stockDe(p)-enFactura(p.id);
    if(c>disp){err.textContent=disp<=0?'No hay existencia de '+p.nombre+'.':'Solo quedan '+disp+' de '+p.nombre+'.';err.hidden=false;return}
    const ya=S.fac.items.find(i=>i.pid===p.id);if(ya)ya.cant+=c;else S.fac.items.push({pid:p.id,nombre:p.nombre,unidad:unidadDe(p),precio:+p.precio||0,costo:+p.costo||0,cant:c});
    err.hidden=true;sel=null;const box=$('#facSel');box.outerHTML=selectorProducto('facSel');bind();cant.value='1';refrescarFac();
    const ic=document.querySelector('.carro-ic');if(ic){ic.classList.remove('bump');void ic.offsetWidth;ic.classList.add('bump')}toast('Agregado al carrito: '+c+' × '+p.nombre)};
  f.addEventListener('click',e=>{if(e.target.closest('[data-facadd]'))agregar();
    if(e.target.closest('[data-qm]')){cant.value=String(Math.max(1,getC()-1))}
    if(e.target.closest('[data-qp]')){cant.value=String(Math.max(1,getC()+1))}
    const cp=e.target.closest('[data-clipick]');if(cp){const c=S.clientes[cp.dataset.clipick];if(c){S.fac.cliNom=c.nombre||'';S.fac.cliTel=c.telefono||'';refrescarFac()}}});
  cant.addEventListener('input',()=>{const d=soloDig(cant.value);if(d!==cant.value)cant.value=d});
  cant.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();agregar()}});
  f.addEventListener('input',e=>{const id=e.target.id;
    if(id&&/^mx[MR]\d+$/.test(id)&&S.fac.mix){const k=+id.slice(3);if(S.fac.mix[k]){S.fac.mix[k][id[2]==='M'?'monto':'ref']=e.target.value;actualizarMix()}return}
    if(id==='facRec'){S.fac.rec=e.target.value;const c=$('#facCambio');if(c)c.innerHTML=htmlCambio();const b=f.querySelector('[data-faccobrar]');const ok=pagoOK();if(b)b.disabled=!ok;const h=$('#facHint');if(h)h.hidden=ok;if(!h&&!ok){}}
    if(id==='facRef'){S.fac.ref=e.target.value;const b=f.querySelector('[data-faccobrar]');const ok=S.fac.ref.trim().length>=4;if(b)b.disabled=!ok;const h=$('#facHint');if(h)h.hidden=ok}
    if(id==='facCliNom'){S.fac.cliNom=e.target.value;sugerirCliente(e.target.value)}
    if(id==='facCliTel'){S.fac.cliTel=e.target.value;sugerirCliente(e.target.value)}});
  f.addEventListener('focusout',e=>{if(['facCliNom','facCliTel'].includes(e.target.id))setTimeout(()=>{const b=$('#cliSug');if(b&&!b.contains(document.activeElement))b.hidden=true},200)});
}
async function siguienteNumero(){const ref=S.db.doc('contadores/facturas');const holder=S.sesion.id+'-'+Math.random().toString(36).slice(2,7);
  for(let i=0;i<8;i++){const r=await ref.acquire({holder,ttlMs:6000});
    if(r.acquired){const snap=await ref.get();const n=(snap.exists?+snap.data().n||0:0)+1;await ref.set({n,ts:Date.now()});return 'F-'+String(n).padStart(6,'0')}
    await new Promise(ok=>setTimeout(ok,400+Math.random()*500))}
  const d=new Date();return 'F-'+diaKey(d).replace(/-/g,'').slice(2)+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+String(d.getSeconds()).padStart(2,'0')}
function confirmarFactura(){const F=S.fac;const tot=facTotal();const tc=tcDe();
  for(const i of F.items){const p=S.productos.get(i.pid);if(!p||i.cant>stockDe(p))return toast('Revisá las cantidades: '+i.nombre+' no tiene suficiente existencia')}
  if(F.mix){const m=mixMsg();if(m)return toast(m)}
  else if(F.metodo==='transferencia'&&F.ref.trim().length<4)return toast('Escribí la referencia de la transferencia');
  if(!F.mix&&!pagoOK())return toast(F.moneda==='USD'?'Escribí cuántos dólares entrega el cliente':'El monto recibido no alcanza para el total');
  const pago=F.metodo==='efectivo'?'Efectivo':'Transferencia '+F.banco;const cn=F.cliNom.trim(),ct=F.cliTel.trim();
  openModal(`<h2>¿Confirmar factura?</h2><div class="credbox" style="font-family:var(--f-body)">
   <div class="r"><span>Cliente</span><b>${cn||ct?esc(cn||'Sin nombre')+(ct?' · '+esc(telFmt(ct)):''):'Consumidor final'}</b></div>
   ${F.items.map(i=>`<div class="r"><span>${i.cant} × ${esc(i.nombre)}</span><b class="num">${fmt(i.precio*i.cant)}</b></div>`).join('')}
   <div class="r" style="border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;font-size:18px"><span><b>Total</b></span><b class="num">${!F.mix&&F.moneda==='USD'?fmtUSD(tot/tc)+' <small class="hint">('+fmt(tot)+')</small>':fmt(tot)}</b></div>
   ${F.mix?mixConfirm():`<div class="r"><span>Pago</span><b>${esc(pago)} · ${F.moneda==='USD'?'Dólares':'Córdobas'}</b></div>
   ${F.metodo==='efectivo'&&!calcCambio().vacio?(()=>{const c=calcCambio();return `<div class="r"><span>Paga con</span><b class="num">${F.moneda==='USD'?'US$'+c.rec.toFixed(2)+' = '+fmt(c.recC):fmt(c.recC)}</b></div><div class="r" style="font-size:17px"><span><b>Cambio (C$)</b></span><b class="num" style="color:var(--teal)">${fmt(c.cambio)}</b></div>`})():''}
   ${F.metodo==='transferencia'?`<div class="r"><span>Referencia</span><b class="num">${esc(F.ref.trim())}</b></div>`:''}`}</div>
   <div class="actions"><button class="btn" data-close>Revisar</button><button class="btn primary" data-facok>Sí, facturar</button></div>`);
}
const facVacia=()=>({mix:null,items:[],metodo:null,banco:null,moneda:null,ref:'',rec:'',cliNom:'',cliTel:'',busy:false});
async function guardarFactura(btn){if(S.fac.busy)return;S.fac.busy=true;if(btn){btn.disabled=true;btn.textContent='Guardando…'}
  const F=S.fac;const tot=Math.round(facTotal()*100)/100;const tc=tcDe();const u=yo();
  try{
    for(const i of F.items){const p=S.productos.get(i.pid);if(!p||i.cant>stockDe(p))throw {msg:'Ya no hay suficiente existencia de '+i.nombre}}
    const numero=await siguienteNumero();const now=Date.now();
    const cn=F.cliNom.trim(),ct=F.cliTel.trim();const cid=claveCliente(cn,ct);
    const venta={numero,ts:now,dia:diaKey(new Date(now)),items:F.items.map(i=>({pid:i.pid,nombre:i.nombre,unidad:i.unidad,precio:i.precio,costo:i.costo,cant:i.cant,subtotal:Math.round(i.precio*i.cant*100)/100})),
      total:tot,metodo:F.metodo,banco:F.metodo==='transferencia'?F.banco:null,moneda:F.moneda,tipoCambio:tc,totalMoneda:F.moneda==='USD'?Math.round(tot/tc*100)/100:tot,
      ...(()=>{if(F.metodo!=='efectivo')return {};const c=calcCambio();return c.vacio?{}:{recibido:c.rec,recibidoC:c.recC,cambio:c.cambio}})(),
      referencia:F.metodo==='transferencia'?F.ref.trim():null,vendedorId:S.sesion.id,vendedorUsuario:u?.usuario||'',estado:'emitida',
      clienteId:cid,clienteNombre:cn||null,clienteTel:ct||null};
    if(F.mix){delete venta.recibido;delete venta.recibidoC;Object.assign(venta,datosMix())}
    await S.db.doc('ventas/'+numero).set(venta);
    for(const i of F.items){const p=S.productos.get(i.pid);if(!p)continue;const antes=stockDe(p);const cur=+((p.vendido||{})[S.sesion.id]||0);
      await S.db.doc('productos/'+p.id).update({vendido:{[S.sesion.id]:cur+i.cant}});
      await movimiento(p,'venta',-i.cant,antes,antes-i.cant,{ticket:numero,metodo:venta.metodo,banco:venta.banco,moneda:venta.moneda,referencia:venta.referencia,precio:i.precio,cliente:cn||null})}
    if(cid){const prev=S.clientes[cid];try{await S.db.doc('clientes/'+cid).set({nombre:cn||prev?.nombre||'',telefono:ct||prev?.telefono||'',ultima:now,creado:prev?.creado||now})}catch(e){}}
    S.fac=facVacia();closeModal();refrescarFac();mostrarFactura(venta);
  }catch(e){S.fac.busy=false;closeModal();toast(e?.msg||'No se pudo guardar la factura. Revisá tu internet e intentá otra vez.')}
}
function facturaTxt(v){const L=[nombreNeg().toUpperCase(),'Factura '+v.numero,new Date(v.ts).toLocaleString('es-NI'),'Atendió: '+v.vendedorUsuario];
  if(v.clienteNombre||v.clienteTel)L.push('Cliente: '+(v.clienteNombre||'')+(v.clienteTel?' · Tel. '+telFmt(v.clienteTel):''));
  L.push('------------------------------');
  for(const i of v.items)L.push(i.cant+' x '+i.nombre+'   '+fmt(i.subtotal));L.push('------------------------------');L.push('TOTAL: '+fmt(v.total));
  if(v.moneda==='USD')L.push('Pagado en dólares: '+fmtUSD(v.totalMoneda)+' (T/C '+(+v.tipoCambio).toFixed(2)+')');
  if(v.metodo==='mixto'){L.push('Pago mixto:');for(const p of v.pagos||[]){const [a,b]=pagoPar(p);L.push('  '+a+': '+b)}if(+v.cambio>0)L.push('Cambio: '+fmt(v.cambio))}
  else{L.push('Pago: '+(v.metodo==='efectivo'?'Efectivo':'Transferencia '+v.banco)+' · '+(v.moneda==='USD'?'Dólares':'Córdobas'));if(v.referencia)L.push('Referencia: '+v.referencia)}
  if(v.recibido!=null){L.push('Paga con: '+(v.moneda==='USD'?'US$'+(+v.recibido).toFixed(2)+' = '+fmt(v.recibidoC):fmt(v.recibidoC)));L.push('Cambio: '+fmt(v.cambio))}
  if(S.config.pie)L.push('',S.config.pie);return L.join('\n')}
function htmlFactura(v){return `<div class="factura">${S.config.logoId?imgLogo('flogo',''):`<h2 style="text-align:center">${esc(nombreNeg())}</h2>`}
   <div class="fhead"><div><span class="hint">Factura</span><b class="num">${esc(v.numero)}</b></div><div style="text-align:right"><span class="hint">${esc(new Date(v.ts).toLocaleDateString('es-NI',{day:'2-digit',month:'short',year:'numeric'}))}</span><b class="num">${esc(new Date(v.ts).toLocaleTimeString('es-NI',{hour:'2-digit',minute:'2-digit'}))}</b></div></div>
   <div class="fcli"><span class="hint">Cliente</span><b>${v.clienteNombre||v.clienteTel?esc(v.clienteNombre||'Sin nombre')+(v.clienteTel?` <span class="num hint">· ${esc(telFmt(v.clienteTel))}</span>`:''):'Consumidor final'}</b></div>
   <div class="fbody">${v.items.map(i=>`<div class="fi"><span>${esc(i.nombre)}<small class="num">${i.cant} × ${fmt(i.precio)}</small></span><b class="num">${fmt(i.subtotal)}</b></div>`).join('')}</div>
   <div class="ftot2"><span>TOTAL</span><b class="num">${fmt(v.total)}</b></div>
   ${v.moneda==='USD'?`<div class="fi" style="padding-top:0"><span class="hint">Pagado en dólares (T/C ${(+v.tipoCambio).toFixed(2)})</span><b class="num">${fmtUSD(v.totalMoneda)}</b></div>`:''}
   ${v.metodo==='mixto'?`<div class="fpago"><span class="pill ok">Pago mixto</span></div>${(v.pagos||[]).map(p=>{const [a,b]=pagoPar(p);return `<div class="fi"><span class="hint">${esc(a)}</span><b class="num">${esc(b)}</b></div>`}).join('')}${+v.cambio>0?`<div class="fi" style="padding-top:0"><span><b>Cambio</b></span><b class="num" style="color:var(--teal)">${fmt(v.cambio)}</b></div>`:''}`:`<div class="fpago"><span class="pill ${v.metodo==='efectivo'?'ok':'superuser'}">${v.metodo==='efectivo'?'Efectivo':'Transferencia · '+esc(v.banco)}</span><span class="pill">${v.moneda==='USD'?'Dólares':'Córdobas'}</span>${v.referencia?`<span class="pill">Ref. ${esc(v.referencia)}</span>`:''}</div>`}
   ${v.recibido!=null?`<div class="fi"><span class="hint">Paga con</span><b class="num">${v.moneda==='USD'?'US$'+(+v.recibido).toFixed(2)+' = '+fmt(v.recibidoC):fmt(v.recibidoC)}</b></div><div class="fi" style="padding-top:0"><span><b>Cambio</b></span><b class="num" style="color:var(--teal)">${fmt(v.cambio)}</b></div>`:''}
   <p class="hint" style="text-align:center;margin:12px 0 0">Atendió: ${esc(v.vendedorUsuario)}${S.config.pie?'<br>'+esc(S.config.pie):''}</p></div>`}

  openModal(`${htmlFactura(v)}
   <div class="facacc"><button class="acc" data-pdffac>${ICON.imprimir}<span>Imprimir</span></button><button class="acc wa" data-wafac>${ICON.whatsapp}<span>WhatsApp</span></button><button class="acc" data-copyfac>${ICON.copiar}<span>Copiar</span></button></div>
   <div class="wabox" id="waBox" hidden><label class="f">Número de WhatsApp del cliente<div class="waf"><span class="num">+505</span><input id="waTel" inputmode="tel" maxlength="12" value="${esc(tel.length===8?tel:'')}" placeholder="8888 8888"></div></label>
    <a class="btn wa-go" id="waGo" target="_blank" rel="noopener">${ICON.whatsapp}<span>Enviar por WhatsApp</span></a><p class="hint" style="margin:6px 0 0">Se abre WhatsApp con la factura escrita; solo tocá <b>Enviar</b>.</p></div>
   <div class="actions"><button class="btn" data-ir="inicio">← Volver al inicio</button><button class="btn primary" data-close>${soloVer?'Cerrar':'Nueva factura'}</button></div>`,
  m=>{const i=m.querySelector('#waTel'),a=m.querySelector('#waGo');const upd=()=>{let d=soloDig(i.value);if(d.length===8)d='505'+d;a.href=d.length>=10?'https://wa.me/'+d+'?text='+encodeURIComponent(facturaTxt(v)):'https://wa.me/?text='+encodeURIComponent(facturaTxt(v));a.classList.toggle('sin',d.length<10)};i.addEventListener('input',upd);upd()});
  mostrarFactura._v=v;
}

function cargarJsPDF(){if(window.jspdf)return Promise.resolve();if(cargarJsPDF._p)return cargarJsPDF._p;
  cargarJsPDF._p=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';sc.onload=()=>window.jspdf?ok():no();sc.onerror=()=>{cargarJsPDF._p=null;no()};document.head.appendChild(sc)});return cargarJsPDF._p}
async function pdfFactura(v,btn){if(!S.dl)return toast('Las descargas no están disponibles en este celular');

const COL_CHICAS=['usuarios','productos','clientes','config','contadores','cajachica'];

async function leerColeccion(n,avance){
  if(COL_CHICAS.includes(n)){const s=await S.db.collection(n).limit(1000).get();const o={};s.docs.forEach(d=>o[d.id]=d.data());return o}
  const o={};let desde=-1;for(let i=0;i<200;i++){const s=await S.db.collection(n).where('ts','>',desde).orderBy('ts','asc').limit(1000).get();s.docs.forEach(d=>o[d.id]=d.data());avance&&avance(n,Object.keys(o).length);if(s.size<1000)break;desde=s.docs[s.docs.length-1].data().ts}

async function descargarRespaldo(btn){if(btn){btn.disabled=true}const est=$('#respEst');const av=(n,k)=>{if(est)est.textContent='Leyendo '+n+'… '+k};
  try{const col={};for(const n of [...COL_CHICAS,...COL_TS]){av(n,0);col[n]=await leerColeccion(n,av)}
    const tot=Object.values(col).reduce((a,o)=>a+Object.keys(o).length,0);const d=new Date();
    const data=JSON.stringify({app:'fannyluu',version:VERSION,fecha:d.toISOString(),porUsuario:yo()?.usuario||'',totales:Object.fromEntries(Object.entries(col).map(([k,o])=>[k,Object.keys(o).length])),colecciones:col});
    await S.dl.save({filename:'Respaldo Fanny Luu '+diaKey(d)+' '+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'.json',data});
    try{await S.db.doc('config/respaldo').set({ultimo:Date.now(),por:yo()?.usuario||'',registros:tot})}catch(e){}
    if(est)est.textContent='Respaldo descargado: '+tot+' registros.';toast('Respaldo descargado')}
  catch(e){if(e?.code!=='declined'){if(est)est.textContent='No se pudo completar el respaldo. Revisá tu internet.';toast('No se pudo descargar el respaldo')}}
  finally{if(btn)btn.disabled=false}}

async function restaurar(j,est){const ns=Object.keys(j.colecciones).filter(n=>/^[a-z]+$/.test(n));let k=0;const tot=ns.reduce((a,n)=>a+Object.keys(j.colecciones[n]).length,0);

    const {_leaseHolder,_leaseExp,...limpio}=d;await S.db.doc(n+'/'+id).set(limpio);k++;if(est&&k%10===0)est.textContent='Restaurando… '+k+' de '+tot}

   <div class="actions full"><button type="button" class="btn" data-close>Cancelar</button><button class="btn danger" type="submit">Continuar</button></div></form>`,
  m=>{setTimeout(()=>$('#lmTxt').focus(),50);m.querySelector('#lmf').addEventListener('submit',e=>{e.preventDefault();

    pedirCredenciales({titulo:'Autorizar limpieza',aviso:'Último paso: escribí el usuario y la contraseña de un <b>Admin</b>. Al aceptar se borran los datos de prueba.',boton:'Sí, borrar todo',
      valida:u=>u.rol==='admin',errorTxt:'Datos incorrectos o el usuario no es Admin.',ok:limpiarDatos})})});
}
async function limpiarDatos(){const est=$('#limpEst');const msg=t=>{S.limpMsg=t;const e2=$('#limpEst');if(e2)e2.textContent=t};let n=0;
  try{
    for(const c of COL_LIMPIAR){msg('Borrando '+c+'…');
      for(let vuelta=0;vuelta<100;vuelta++){const snap=await S.db.collection(c).limit(500).get();if(!snap.docs.length)break;
        for(const d of snap.docs){await S.db.doc(c+'/'+d.id).delete();n++;if(n%20===0)msg('Borrando '+c+'… '+n+' registros')}
        if(snap.docs.length<500)break}}
    msg('Borrando usuarios de prueba…');
    const usSnap=await S.db.collection('usuarios').get();for(const d of usSnap.docs){const u=d.data()||{};if(u.rol==='admin')continue;await S.db.doc('usuarios/'+d.id).delete();n++}
    S.fac=facVacia();S.cli.ventas=null;S.hinv.datos=null;
    msg('Listo: se borraron '+n+' registros. Los Admin y la configuración se conservaron.');toast('Datos de prueba borrados');
    regAcceso('limpieza',S.sesion.id,yo()?.usuario||'',{registros:n})}
  catch(e){msg('La limpieza se detuvo ('+n+' registros borrados). Revisá tu internet y volvé a tocar Limpiar para terminar.')}}
async function pedirRestaurar(f,est,despues){let j;try{j=await leerArchivoRespaldo(f)}catch(e){est.textContent=e.message;return}
  const t=j.totales||{};const det=Object.entries(t).filter(([,v])=>v).map(([k,v])=>v+' '+k).join(', ');
  const hacer=async()=>{est.textContent='Restaurando…';try{const k=await restaurar(j,est);est.textContent='Listo: se restauraron '+k+' registros.';toast('Respaldo restaurado');despues&&despues()}catch(e){est.textContent='Se detuvo la restauración. Revisá tu internet e intentá otra vez.'}};
  if(!Object.keys(S.usuarios).length){hacer();return}
  pedirCredenciales({titulo:'¿Restaurar este respaldo?',aviso:`Respaldo del <b>${esc(fechaHora(Date.parse(j.fecha)))}</b> (versión ${esc(j.version||'')}).<br>Contiene: ${esc(det||'sin datos')}.<br>Escribí el usuario y la contraseña de un <b>Admin</b>.`,boton:'Sí, restaurar',
    valida:u=>u.rol==='admin',errorTxt:'Datos incorrectos o el usuario no es Admin.',ok:hacer})}

  const filtrada=S.filtro==='todos'?lista:lista.filter(u=>u.rol===S.filtro);

  return `${atras()}<h2>Registro de Usuarios</h2>
  <div class="row"><button class="btn primary" data-nuevo style="flex:1">+ Crear nuevo usuario</button><button class="btn" data-ir="historial">Historial de movimientos</button></div>
  <div class="chips"><button class="chip" data-filtro="todos" aria-pressed="${S.filtro==='todos'}">Todos (${lista.length})</button>${ORDEN.map(r=>`<button class="chip" data-filtro="${r}" aria-pressed="${S.filtro===r}">${ROLES[r].label} (${cuenta(r)})</button>`).join('')}</div>
  <div class="card">${filtrada.length?filtrada.map(u=>`<button class="urow" data-user="${esc(u.id)}" ${puedeEditar(u)||u.id===S.sesion.id?'':'disabled'}>
    ${avatar(u.id,u)}<span class="nm">${esc(nombreCompleto(u))}${u.id===S.sesion.id?' (vos)':''}</span>
    <span class="rl"><span class="pill ${u.rol}">${ROLES[u.rol]?.label||u.rol}</span>${u.activo===false?'<span class="pill out">Desactivado</span>':bloqueado(u)?'<span class="pill out">Bloqueado</span>':u.debeCambiar?'<span class="pill low">Clave temporal</span>':''}</span>

async function crearUsuario(r){
  const nombre=cap(primera($('#nNom').value)),apellido=cap(primera($('#nApe').value));const err=$('#nErr');
  const usuario=generarUsuario(nombre,apellido);
  if(!nombre||!apellido||!usuario.includes('.')||usuario.startsWith('.')||usuario.endsWith('.')){err.textContent='Escribí el primer nombre y el apellido.';err.hidden=false;return}
  if(!rolesAsignables().includes(r)){err.textContent='No tenés permiso para crear ese rol.';err.hidden=false;return}
  pedirCredenciales({
    titulo:'¿Estás seguro de crear este usuario?',
    aviso:`Se va a crear <b class="num">${esc(usuario)}</b> (${esc(nombre)} ${esc(apellido)}) con el rol <b>${ROLES[r].label}</b>. Para confirmar, escribí tu usuario y contraseña.`,
    boton:'Sí, crear usuario',
    valida:u=>u.id===S.sesion.id,
    errorTxt:'Usuario o contraseña incorrectos. Escribí los datos con los que entraste.',
    ok:async()=>{
      const clave=claveTemporal(),salt=rndSalt(),hash=await hashClave(salt,clave);const id=idDe(usuario);
      try{await S.db.doc('usuarios/'+id).set({usuario,nombre,apellido,rol:r,salt,hash,clave,debeCambiar:true,activo:true,creado:Date.now(),creadoPor:S.sesion.id});
        registrar('crear',id,usuario,{a:r});mostrarCredenciales({usuario,nombre,clave,rol:r},true)}
      catch(e){toast('No se pudo crear. Revisá tu internet e intentá otra vez.')}
    }});
}
/* pide usuario y contraseña de nuevo antes de una acción delicada */
function pedirCredenciales(o){
  openModal(`<h2>${esc(o.titulo)}</h2><div class="banner" style="margin-bottom:14px">${o.aviso}</div>
   <form id="rf" class="form" autocomplete="off"><label class="f full">Usuario<input id="rUser" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
   <label class="f full">Contraseña<span class="pw"><input id="rPass" type="password" required><button type="button" data-ver="rPass">Mostrar</button></span></label>
   <p class="err full" id="rErr" hidden></p>
   <div class="actions full"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">${esc(o.boton)}</button></div></form>`,
  m=>{setTimeout(()=>$('#rUser').focus(),50);m.querySelector('#rf').addEventListener('submit',async e=>{e.preventDefault();
    const id=idDe($('#rUser').value),rec=S.usuarios[id],err=$('#rErr');
    const bad=()=>{err.textContent=o.errorTxt;err.hidden=false;$('#rPass').value='';$('#rPass').focus()};
    if(rec&&bloqueado(rec)){err.textContent='Ese usuario está bloqueado por intentos fallidos. Esperá '+minsBloqueo(rec)+' min.';err.hidden=false;return}
    if(!rec||rec.activo===false||!rec.hash||!o.valida({id,...rec})){if(rec)intentoFallido(id,rec,'confirmación');return bad()}
    if(!(await verificarClave(rec,$('#rPass').value))){const q=await intentoFallido(id,rec,'confirmación');if(q===0){err.textContent='Usuario bloqueado por '+SEG.bloqueoMin+' minutos por demasiados intentos fallidos.';err.hidden=false;$('#rPass').value='';return}return bad()}
    intentoOk(id,rec).catch(()=>{});
    document.activeElement?.blur();closeModal();o.ok({id,...rec});})});
}

async function registrar(tipo,objId,objUsuario,extra={}){
  const yoU=yo();try{await S.db.collection('historial').add({ts:Date.now(),tipo,objId,objUsuario,porId:S.sesion.id,porUsuario:yoU?.usuario||'',...extra})}catch(e){console.warn('historial',e)}
}
const TIPOS={crear:'Usuario creado',rol:'Cambio de rol',clave:'Contraseña cambiada',activar:'Usuario activado',desactivar:'Usuario desactivado',eliminar:'Usuario eliminado',login:'Inicio de sesión',salida:'Cierre de sesión',inactividad:'Cierre por inactividad',vencida:'Sesión vencida',fallo:'Intento fallido',bloqueo:'Usuario bloqueado',desbloqueo:'Usuario desbloqueado',sesiones:'Sesiones cerradas',limpieza:'Datos de prueba borrados',recuperacion:'Contraseña recuperada con clave de tienda'};
function vHistorial(){
  const H=S.hist;
  if(!H.ok)return `${atras('usuarios','← Registro de Usuarios')}<h2>Historial de movimientos</h2><div class="empty"><b>Acceso protegido</b>Para ver el historial se necesita el usuario y la contraseña de un Admin.<div class="actions" style="justify-content:center"><button class="btn primary" data-histauth>Ingresar contraseña de Admin</button></div></div>`;
  let h=`${atras('usuarios','← Registro de Usuarios')}<h2>Historial de movimientos</h2>
  <div class="chips"><button class="chip" data-hf="todos" aria-pressed="${H.filtro==='todos'}">Todos</button>${Object.entries(TIPOS).map(([k,l])=>`<button class="chip" data-hf="${k}" aria-pressed="${H.filtro===k}">${l}</button>`).join('')}</div>`;
  if(!H.datos)return h+`<div class="empty"><b>Cargando…</b></div>`;
  const list=H.filtro==='todos'?H.datos:H.datos.filter(x=>x.tipo===H.filtro);
  if(!list.length)return h+`<div class="empty"><b>Sin movimientos</b>Aquí aparece cada vez que se crea un usuario, se cambia un rol o una contraseña, se activa, desactiva o elimina.</div>`;
  const lbl=r=>ROLES[r]?.label||r||'';
  h+=`<div class="card">${list.map(x=>{const f=new Date(x.ts);
    const det=x.tipo==='rol'?`${esc(lbl(x.de))} → <b>${esc(lbl(x.a))}</b>`:x.tipo==='crear'?`Rol: <b>${esc(lbl(x.a))}</b>`:x.tipo==='eliminar'&&x.de?`Tenía rol ${esc(lbl(x.de))}`:'';
    return `<div class="urow" style="grid-template-columns:1fr auto"><span class="nm">${esc(TIPOS[x.tipo]||x.tipo)} · <span class="num">${esc(x.objUsuario)}</span></span><span class="rl"><span class="hint num" style="font-size:13px">${f.toLocaleDateString('es-NI',{day:'2-digit',month:'short',year:'numeric'})}</span><span class="hint num" style="font-size:13px">${f.toLocaleTimeString('es-NI',{hour:'2-digit',minute:'2-digit'})}</span></span>
    <span class="sub" style="font-family:var(--f-body)">${det?det+' · ':''}por ${esc(x.porUsuario)}</span></div>`}).join('')}</div>`;
  return h;
}
async function cargarHistorial(){S.hist.datos=null;render();
  try{const snap=await S.db.collection('historial').orderBy('ts','desc').limit(500).get();S.hist.datos=snap.docs.map(d=>({id:d.id,...d.data()}))}
  catch(e){S.hist.datos=[];toast('No se pudo cargar el historial')}render()}

async function resetClave(id){const u=S.usuarios[id];const v=$('#eClave').value.trim();const vErr=validarClave(v,u);if(vErr)return toast(vErr);
  const forzar=$('#eForzar').checked;const salt=rndSalt(),hash=await hashClave(salt,v);

  catch(e){toast('No se pudo guardar. Revisá tu internet.')}}

  db.collection('usuarios').onSnapshot(async s=>{const u={},t={};s.docs.forEach(d=>u[d.id]=d.data());await Promise.all(Object.entries(u).map(async([id,r])=>{t[id]=await tokenDe(r)}));S.usuarios=u;S.tok=t;if(!s.metadata.fromCache)got.u=true;listo()},()=>{S.connected=false;S.salud.dbErr=true;fallo('Sin conexión.')});

}
