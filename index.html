<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d11c24"><title>Variedades Fanny Luu</title><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: clean white app (single light theme, chosen on purpose so the Fanny Luu logo sits on white) — white top bar with a red/gold rule, red actions, gold highlights; login is a white page with soft red and gold shapes */
:root{
  --bg:#fbfaf8; --surface:#ffffff; --surface-2:#fdf8f1; --ink:#1d1916; --muted:#6c645d; --line:#e9e4de;
  --brand:#a8111a; --brand-2:#d61f26; --brand-ink:#ffffff; --brand-muted:#ffd9db;
  --accent:#d11c24; --accent-ink:#ffffff; --accent-soft:#fdeaea;
  --gold:#ffc61a; --gold-soft:#fff5d1; --gold-ink:#5b4300;
  --teal:#0f7a5c; --teal-soft:#e2f4ec; --warn:#a8651a; --warn-soft:#fcf1e2; --bad:#c43b3b; --bad-soft:#fce9e9;
  --online:#16a36a;
  --shadow:0 1px 2px rgb(40 20 10 / .06),0 4px 14px rgb(40 20 10 / .06);
  --shadow-lg:0 12px 40px rgb(50 10 10 / .22);
  --f-display:"Manrope", "Segoe UI", system-ui, sans-serif;
  --f-body:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
:root[data-tema="oscuro"]{--bg:#141517; --surface:#1e1f23; --surface-2:#191a1d; --ink:#f1f1f3; --muted:#a2a5ac; --line:#2e3036;
  --brand:#b3151d; --brand-2:#d61f26; --brand-ink:#ffffff; --brand-muted:#ffd0c4;
  --accent:#ff5a60; --accent-ink:#ffffff; --accent-soft:#3a1f22;
  --gold:#ffcc33; --gold-soft:#332a12; --gold-ink:#ffe08a;
  --teal:#5fd6a8; --teal-soft:#16302a; --warn:#ffc65c; --warn-soft:#352b14; --bad:#ff8a8a; --bad-soft:#3d1c1f;
  --online:#3ee08a; --shadow:0 1px 2px rgb(0 0 0 / .4),0 6px 18px rgb(0 0 0 / .35); --shadow-lg:0 14px 44px rgb(0 0 0 / .55); color-scheme:dark}
@media (prefers-color-scheme: dark){:root[data-tema="sistema"]{--bg:#141517; --surface:#1e1f23; --surface-2:#191a1d; --ink:#f1f1f3; --muted:#a2a5ac; --line:#2e3036;
  --brand:#b3151d; --brand-2:#d61f26; --brand-ink:#ffffff; --brand-muted:#ffd0c4;
  --accent:#ff5a60; --accent-ink:#ffffff; --accent-soft:#3a1f22;
  --gold:#ffcc33; --gold-soft:#332a12; --gold-ink:#ffe08a;
  --teal:#5fd6a8; --teal-soft:#16302a; --warn:#ffc65c; --warn-soft:#352b14; --bad:#ff8a8a; --bad-soft:#3d1c1f;
  --online:#3ee08a; --shadow:0 1px 2px rgb(0 0 0 / .4),0 6px 18px rgb(0 0 0 / .35); --shadow-lg:0 14px 44px rgb(0 0 0 / .55); color-scheme:dark}}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

/* barra superior */
.top{border-bottom:0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);color:var(--ink);background-image:linear-gradient(90deg,var(--accent) 0 50%,var(--gold) 50% 100%);background-size:100% 4px;background-repeat:no-repeat;background-position:bottom;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  display:flex;align-items:center;gap:12px;box-shadow:0 2px 14px rgb(40 20 10 / .08)}
.logo{width:42px;height:42px;border-radius:12px;background:var(--gold);color:var(--brand)!important;color:#fff;display:grid;place-items:center;
  font-family:var(--f-display);font-weight:800;font-size:20px;flex:none;overflow:hidden;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .15)}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand{min-width:0;flex:1}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:18px;margin:0;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.live.on{background:var(--online);animation:pulse 2.4s infinite}
.out{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:10px;padding:8px 12px;font-weight:700;transition:background .2s}
.out:hover{background:var(--accent-soft)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 48px;max-width:880px;margin:0 auto}
.enter>*{animation:rise .38s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.03s}.enter>*:nth-child(3){animation-delay:.06s}.enter>*:nth-child(4){animation-delay:.09s}.enter>*:nth-child(5){animation-delay:.12s}.enter>*:nth-child(n+6){animation-delay:.15s}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}

h2{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:4px 0 14px;text-wrap:balance}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:800}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700;box-shadow:var(--shadow);
  transition:transform .12s var(--ease),box-shadow .2s,background .2s,border-color .2s}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);box-shadow:none;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin:12px 0;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--muted);transition:all .2s var(--ease)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 30%,transparent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px;box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.low{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.out{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.ok{background:var(--teal-soft);color:var(--teal);border-color:transparent}
.pill.admin{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pill.superuser{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.pill.user{background:var(--teal-soft);color:var(--teal);border-color:transparent}
.pill.visitor{background:var(--surface-2);color:var(--muted)}

/* ventanas */
.sheet{position:fixed;inset:0;z-index:20;background:rgb(20 8 6 / .55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease both}
.sheet>.panel{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:22px calc(20px + env(safe-area-inset-bottom,0px));animation:up .32s var(--ease) both}
@media (min-width:600px){.sheet{align-items:center}.sheet>.panel{border-radius:22px}}
.panel h2{margin-top:0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted);font-weight:700}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;color:var(--ink);font-weight:500;font-size:16px;transition:border-color .2s,box-shadow .2s,background .2s}
label.f textarea{resize:vertical;min-height:64px;font-family:inherit;line-height:1.4}
label.f input:focus,label.f textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
@media (max-width:420px){.form{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:14px}
.err{color:var(--bad);font-size:14px;font-weight:600;animation:shake .35s}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:19px;margin-bottom:6px}

/* inicio de sesión */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  background:radial-gradient(600px 380px at -8% -6%,color-mix(in srgb,var(--gold) 38%,transparent),transparent 70%),radial-gradient(700px 420px at 108% 108%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),var(--bg);
  background:radial-gradient(900px 520px at 50% -12%,color-mix(in srgb,var(--gold) 55%,var(--brand-2)),transparent 62%),radial-gradient(900px 500px at 110% 110%,var(--brand-2),transparent 60%),var(--brand);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px}
.login::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgb(209 28 36 / .05) 1px,transparent 1px),linear-gradient(90deg,rgb(209 28 36 / .05) 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(circle at center,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(circle at center,#000 30%,transparent 75%)}
.login form,.login .empty{position:relative;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;background:var(--surface);border-radius:24px;padding:30px 26px;box-shadow:0 18px 50px rgb(120 20 20 / .14);border-top:5px solid var(--accent);animation:up .45s var(--ease) both}
.login .empty b{color:var(--ink)}
.login .logo{width:72px;height:72px;font-size:32px;border-radius:20px;margin:0 auto;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.login h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;text-align:center;margin:4px 0 0;text-wrap:balance}
.login p.sub{text-align:center;color:var(--muted);margin:-8px 0 6px}
.login .btn{padding:14px;font-size:16.5px}
.pw{position:relative;display:flex}
.pw input{flex:1;min-width:0;padding-right:92px!important}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--accent);font-weight:700;font-size:13.5px;padding:8px}

/* inicio */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hello p{margin:-10px 0 0;color:var(--muted)}
.home{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:8px}
.mod{display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:18px;min-height:132px;box-shadow:var(--shadow);
  transition:transform .25s var(--ease),box-shadow .25s,border-color .25s;position:relative;overflow:hidden}
.mod:not(.soon):hover{transform:translateY(-3px);box-shadow:0 10px 28px rgb(40 20 10 / .12);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.mod:not(.soon):active{transform:scale(.98)}
.mod .ic{width:44px;height:44px;border-radius:12px;background:var(--gold-soft);color:var(--accent);display:grid;place-items:center}
.mod svg{width:24px;height:24px}
.mod b{font-family:var(--f-display);font-size:17px;line-height:1.2;letter-spacing:-.01em}
.mod span.d{font-size:13px;color:var(--muted);line-height:1.35}
.mod svg.go{width:18px;height:18px}
.mod .go{position:absolute;right:16px;top:20px;color:var(--muted);transition:transform .25s var(--ease)}
.mod:hover .go{transform:translateX(3px);color:var(--accent)}
.mod.soon{border-style:dashed;box-shadow:none;background:transparent;cursor:default}
.mod.soon .ic{background:var(--surface-2);color:var(--muted)}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0;margin-bottom:8px;font-size:15px;display:inline-flex;gap:6px;align-items:center}
.back:hover{text-decoration:underline}

/* personas */
.urow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;transition:background .2s}
button.urow:not(:disabled):hover{background:linear-gradient(90deg,transparent,var(--surface-2),transparent)}
.card .urow:last-child{border-bottom:0}
.av{position:relative;width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;grid-row:span 2;flex:none}
.av.admin{background:var(--accent);color:var(--accent-ink)}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:var(--muted);border:2.5px solid var(--surface)}
.av .dot.on{background:var(--online)}
.av .dot.on::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--online);animation:ring 2s infinite}
.urow .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.urow .sub{color:var(--muted);font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.urow .rl{grid-row:span 2;text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.st-on{color:var(--online);font-weight:700}
.team{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.tm{flex:none;width:86px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.tm .av{width:52px;height:52px;font-size:19px}
.tm .av .dot{width:15px;height:15px}
.tm b{font-size:13px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm small{font-size:11.5px;color:var(--muted);line-height:1.2}
.tm small.st-on{color:var(--online)}
.count{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--online);background:color-mix(in srgb,var(--online) 12%,transparent);border-radius:999px;padding:4px 10px}
.count i{width:7px;height:7px;border-radius:50%;background:var(--online);animation:pulse 2.4s infinite}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roles button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px;text-align:left;transition:all .2s var(--ease)}
.roles button b{display:block}
.roles button small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.roles button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.roles button:disabled{opacity:.4;cursor:not-allowed}
.preview{font-family:var(--f-mono);font-size:18px;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:11px 14px;overflow-wrap:anywhere;transition:all .2s}
.credbox{background:var(--surface-2);border:1px dashed var(--line);border-radius:14px;padding:14px 16px;font-family:var(--f-mono)}
.credbox .r{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.credbox .r b{overflow-wrap:anywhere;text-align:right}
.secret{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.secret code{font-family:var(--f-mono);font-size:17px;font-weight:600;overflow-wrap:anywhere;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;background:linear-gradient(120deg,var(--brand),var(--brand-2));color:var(--brand-ink);border-left:4px solid var(--gold);padding:12px 18px;border-radius:14px;font-weight:700;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg);transform:translateX(-50%);animation:toast .35s var(--ease) both}


/* inventario */
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 16px}
.op{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s}
.op:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.op:active{transform:scale(.98)}
.op .ic{width:38px;height:38px;border-radius:11px;background:var(--gold-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:4px}
.op .ic svg{width:21px;height:21px}
.op b{font-size:15px;line-height:1.2}
.op small{font-size:12.5px;color:var(--muted)}
.badge{position:absolute;top:10px;right:10px;min-width:24px;height:24px;border-radius:999px;background:var(--bad);color:#fff;font-size:12.5px;font-weight:800;display:grid;place-items:center;padding:0 7px;animation:pop .4s var(--ease)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;box-shadow:var(--shadow)}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:700}
.kpi b{display:block;font-size:21px;margin-top:2px;overflow-wrap:anywhere}
button.kpi{transition:border-color .2s}
.kpi.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.kpi.warn b{color:var(--warn)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;align-items:center}
.card .prow:last-child{border-bottom:0}
.prow .pc{grid-column:1;font-size:11.5px;color:var(--muted)}
.prow .pn{grid-column:1;font-weight:700;min-width:0;overflow-wrap:anywhere}
.prow .pm{grid-column:1;color:var(--muted);font-size:13.5px}
.prow .ps{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.prow .ps b{font-size:21px}
.lbl{margin:0 0 6px;font-size:13.5px;color:var(--muted);font-weight:700}
.picker{display:flex;flex-direction:column}
.picker .search{width:100%}
.picker .plist{max-height:300px;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);animation:rise .18s var(--ease)}
.picker mark,.tbl mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 1px}
.picker .plist button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;align-items:center}
.picker .plist button:last-child{border-bottom:0}
.picker .plist button:hover{background:var(--accent-soft)}
.picker .plist small,.picker .psel small{display:block;color:var(--muted);font-size:12px}
.picker .psel b{display:block}
.picker .psel{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:10px 12px;animation:rise .25s var(--ease)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;font-size:14px;padding:8px 0 0}
.resumen{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:14.5px;animation:rise .25s var(--ease)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px;text-align:left;transition:all .2s var(--ease)}
.seg2 button b{display:block}
.seg2 button small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.seg2 button[data-tipo="sumar"][aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);box-shadow:0 0 0 1px var(--teal) inset}
.seg2 button[data-tipo="baja"][aria-pressed="true"]{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 0 0 1px var(--bad) inset}
label.f select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.card .mrow:last-child{border-bottom:0}
.mt{min-width:52px;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:15px;border-radius:10px;padding:6px 8px;background:var(--surface-2);color:var(--muted)}
.mt.in{background:var(--teal-soft);color:var(--teal)}
.mt.outm{background:var(--bad-soft);color:var(--bad)}
.mn{min-width:0;font-weight:700;overflow-wrap:anywhere}
.mn small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.adj{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);animation:rise .3s var(--ease) both}
.adj-h{display:flex;gap:12px;align-items:center}
.adj-h b{display:block;overflow-wrap:anywhere}
.adj-h small{color:var(--muted);font-size:13px}
.adj-n{margin:10px 0 0;padding:8px 12px;border-left:3px solid var(--line);color:var(--muted);font-style:italic}
.adj-m{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.neg{color:var(--bad)}
.pdh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pdstk{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pdstk b{font-size:34px;line-height:1}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);margin-top:14px}
.tbl table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
.tbl th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl td:first-child{white-space:normal;min-width:180px;position:sticky;left:0;background:var(--surface)}
.tbl th:first-child{left:0;z-index:1}
.tbl td small{display:block;color:var(--muted);font-size:12px}
.tbl .r{text-align:right}
.tbl tbody tr{cursor:pointer;transition:background .15s}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tfoot td{font-weight:800;background:var(--accent-soft);border-bottom:0}
.tbl tfoot td:first-child{background:var(--accent-soft)}
.dayh{margin:18px 0 8px;font-weight:800;font-size:13px;color:var(--muted);text-transform:capitalize}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.card .hrow:last-child{border-bottom:0}
.hb{min-width:0}
.hb>b{display:block;overflow-wrap:anywhere}
.hb small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.hb small b{color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-right:2px}

.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.top .out{justify-self:end}
.logo.wide{width:auto;height:auto;padding:0;background:transparent;border-radius:0;box-shadow:none;display:flex;align-items:center;justify-content:center}
.logo.wide img{display:block;height:46px;width:auto;max-width:160px;object-fit:contain;background:transparent;filter:none}
.logo.wide.big img{height:72px;max-width:220px;filter:none}
@media (max-width:380px){.logo.wide img{height:38px;max-width:120px}}
.top .brand small{font-size:13.5px;color:var(--ink);font-weight:600}
.loginlogo{display:block;width:100%;max-width:300px;height:auto;margin:0 auto 4px;animation:pop .6s var(--ease) both}
.loginlogo.sm{max-width:220px}

.sheet.big>.panel{max-width:1000px;height:94%;max-height:94%}
@media (min-width:600px){.sheet.big>.panel{height:auto;max-height:90%}}
.rephead{position:sticky;top:-22px;z-index:2;background:var(--surface);padding:6px 0 10px;margin:-6px 0 6px;border-bottom:1px solid var(--line)}
.rephead h2{margin:0}
.kpis3{grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.kpis3{grid-template-columns:repeat(3,1fr)}}

.tright{justify-self:end;display:flex;align-items:center;gap:8px}
.nube{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;position:relative;transition:background .2s}
.nube svg{width:24px;height:24px}
.nube.bien{color:var(--online)}.nube.medio{color:var(--warn)}.nube.mal{color:var(--bad);animation:shake .5s 2}
.nube.bien::after{content:"";position:absolute;inset:-1px;border-radius:12px;border:2px solid var(--online);opacity:0;animation:ring 3s infinite}
.nube:hover{background:var(--surface-2)}
.nube.lg{width:56px;height:56px;border-radius:16px;flex:none;border:0}
.nube.lg svg{width:32px;height:32px}
.shead{display:flex;gap:14px;align-items:center}
.shead .nube.bien{background:var(--teal-soft);color:var(--teal)}.shead .nube.medio{background:var(--warn-soft);color:var(--warn)}.shead .nube.mal{background:var(--bad-soft);color:var(--bad)}
.srow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.card .srow:last-child{border-bottom:0}
.srow b{display:block}.srow small{color:var(--muted);font-size:13px}
.sdot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--muted)}
.sdot.bien{background:var(--online)}.sdot.medio{background:var(--warn)}.sdot.mal{background:var(--bad)}
@media (max-width:400px){.out{padding:8px 10px}.nube{width:36px;height:36px}}

.tbl.lista table{min-width:0}
.tbl.lista td:first-child{min-width:150px}
.tbl.lista td{white-space:normal}
.tbl .vacio{text-align:center;color:var(--muted);padding:28px 12px;position:static}

details.mas{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface-2)}
details.mas summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:14px}

.req{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-left:4px}
.adj-c{margin-top:10px;background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px}
.adj-c span{font-size:12.5px;color:var(--muted)}
.adj-c p{margin:4px 0 0;font-size:15px;color:var(--ink);overflow-wrap:anywhere}
.hb small.com{color:var(--ink);font-style:italic;background:var(--gold-soft);border-radius:8px;padding:4px 8px;margin:4px 0 2px;display:inline-block}

/* facturar */
.mod-fac{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:linear-gradient(160deg,var(--surface) 55%,var(--accent-soft))}
.mod-fac .ic{background:var(--accent)!important;color:var(--accent-ink)!important}
.fline{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.fl-i b{display:block;overflow-wrap:anywhere}.fl-i small{display:block;color:var(--muted);font-size:12.5px}.fl-i small.neg{color:var(--bad);font-weight:700}
.fl-t{min-width:84px;text-align:right}
.fl-x{border:0;background:none;color:var(--muted);font-size:15px;padding:6px}
.fl-x:hover{color:var(--bad)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:800;font-size:16px}
.stepper span{min-width:24px;text-align:center;font-weight:700}
.ftot{display:flex;justify-content:space-between;align-items:center;padding:14px 0 12px}
.ftot span{font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ftot b{font-size:26px;color:var(--accent);display:block;text-align:right}
.ftot small{display:block;text-align:right;color:var(--muted);font-size:13px}
.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-size:16px;transition:all .2s var(--ease);box-shadow:var(--shadow)}
.pay .pi{width:38px;height:38px;border-radius:10px;background:var(--gold-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.pay .pi svg{width:22px;height:22px}
.pay[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.pay[aria-pressed="true"] .pi{background:var(--accent);color:var(--accent-ink)}
.bancos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:460px){.bancos{grid-template-columns:repeat(2,1fr)}}
.banco{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 8px;font-weight:800;font-size:15px;transition:all .2s var(--ease);position:relative}
.banco[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.banco[aria-pressed="true"]::after{content:"✓";position:absolute;top:4px;right:8px;font-size:12px;color:var(--accent)}
.b-bac{color:#c8102e}.b-banpro{color:#0a7a3e}.b-ficohsa{color:#0b3d91}.b-lafise{color:#00843d}
.seg2.mon button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.btn.big{padding:15px 18px;font-size:17px}
.factura{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:18px}
.flogo{display:block;max-width:220px;width:70%;margin:0 auto 10px}
.fhead{display:flex;justify-content:space-between;gap:10px;border-top:3px solid var(--accent);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:6px}
.fhead span{display:block;font-size:12px}.fhead b{font-size:16px}
.fi{display:flex;justify-content:space-between;gap:12px;padding:8px 0;align-items:flex-start}
.fi span{min-width:0;overflow-wrap:anywhere}.fi small{display:block;color:var(--muted);font-size:12.5px}
.fbody{border-bottom:1px dashed var(--line)}
.ftot2{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-weight:800}
.ftot2 b{font-size:24px;color:var(--accent)}
.fpago{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}

/* tema */
.temab{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;padding:0}
.temab svg{width:20px;height:20px}
.temab:hover{background:var(--surface-2)}
.temas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.temas button{display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:16px 8px;font-weight:700;transition:all .2s var(--ease)}
.temas button svg{width:26px;height:26px;color:var(--accent)}
.temas button small{font-weight:500;color:var(--muted);font-size:12px;text-align:center}
.temas button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.temaflot{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:6}
img.lg-o{display:none!important}
:root[data-tema="oscuro"] img.lg-c.con-o{display:none!important}:root[data-tema="oscuro"] img.lg-o{display:block!important}
@media (prefers-color-scheme: dark){:root[data-tema="sistema"] img.lg-c.con-o{display:none!important}:root[data-tema="sistema"] img.lg-o{display:block!important}}
:root[data-tema="oscuro"] .login::before{background-image:linear-gradient(rgb(255 255 255 / .04) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255 / .04) 1px,transparent 1px)}
@media (max-width:420px){.temab{width:36px;height:36px}.tright{gap:6px}}

.ffechas{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.fpar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbl td.pos{color:var(--teal);font-weight:700}.tbl td.negc{color:var(--bad);font-weight:700}

/* sin flechitas en campos numéricos */
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
/* cantidad − + */
.addrow{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.addrow>div{flex:1;min-width:150px}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;background:var(--surface-2);overflow:hidden;width:max-content;max-width:100%}
.qty button{width:48px;height:48px;border:0;background:transparent;font-size:24px;font-weight:700;color:var(--accent);display:grid;place-items:center;transition:background .15s}
.qty button:hover{background:var(--accent-soft)}.qty button:active{transform:scale(.92)}
.qty input{width:64px;height:48px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--surface);text-align:center;font-family:var(--f-mono);font-size:18px;font-weight:700;color:var(--ink)}
.qty input:focus{outline:none;background:var(--accent-soft)}
.qty.sm{border-radius:999px}
.qty.sm button{width:34px;height:34px;font-size:18px}
.qty.sm span{min-width:30px;text-align:center;font-family:var(--f-mono);font-weight:700}
.addbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1;min-width:190px;height:52px}
.addbtn svg{width:20px;height:20px}
/* carrito */
.carro{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 16px 4px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.carro::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--accent),var(--gold))}
.carro-h{display:flex;align-items:center;gap:12px;padding:14px 0 12px;border-bottom:1px solid var(--line)}
.carro-h>div{flex:1;min-width:0}.carro-h b{display:block;font-size:17px}.carro-h small{color:var(--muted);font-size:13px}
.carro-ic{position:relative;width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.carro-ic svg{width:24px;height:24px}
.carro-n{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;border-radius:999px;background:var(--gold);color:#3a2a00;font-style:normal;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 6px;border:2px solid var(--surface)}
.carro-ic.bump{animation:bump .45s var(--ease)}
@keyframes bump{30%{transform:scale(1.18) rotate(-8deg)}60%{transform:scale(.95)}}
.carro.vacio .carro-h{border-bottom:0}
.carro.vacio .carro-ic{background:var(--surface-2);color:var(--muted);box-shadow:none}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px dashed var(--line);animation:rise .25s var(--ease)}
.cl-i b{display:block;overflow-wrap:anywhere}.cl-i small{display:block;color:var(--muted);font-size:12.5px}.cl-i small.neg{color:var(--bad);font-weight:700}
.cl-t{text-align:right;min-width:86px}.cl-t b{display:block}
.cl-x{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 0;text-decoration:underline}
.cl-x:hover{color:var(--bad)}
@media (max-width:440px){.cline{grid-template-columns:minmax(0,1fr) auto}.cline .cl-t{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;text-align:left}}
.tasa{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);background:var(--gold-soft);border-radius:10px;padding:8px 12px;margin:0 0 12px}
.tasa b{color:var(--ink)}
.opc{font-size:11px;letter-spacing:.04em;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:4px;text-transform:uppercase}
.cli .plist{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.cli .plist button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;align-items:center}
.cli .plist button:last-child{border-bottom:0}.cli .plist button:hover{background:var(--accent-soft)}
.cli .plist small{display:block;color:var(--muted);font-size:12px}
.fcli{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.fcli b{text-align:right;overflow-wrap:anywhere}

.facacc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.acc{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;font-weight:700;font-size:14px;transition:all .2s var(--ease)}
.acc svg{width:24px;height:24px;color:var(--accent)}
.acc:hover{border-color:var(--accent);background:var(--accent-soft)}.acc:active{transform:scale(.97)}
.acc.wa svg{color:#25d366}.acc.wa:hover{border-color:#25d366;background:color-mix(in srgb,#25d366 12%,transparent)}
.wabox{margin-top:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;animation:rise .25s var(--ease)}
.waf{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.waf span{padding:0 10px 0 12px;color:var(--muted);font-weight:700}
.waf input{border:0!important;background:transparent!important;box-shadow:none!important;flex:1;min-width:0}
.wa-go{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;background:#25d366;border-color:#25d366;color:#fff;text-decoration:none;box-shadow:0 4px 14px rgb(37 211 102 / .35)}
.wa-go svg{width:20px;height:20px}
.wa-go.sin{opacity:.9}

/* reporte de ventas */
.mod-rv .ic{background:var(--teal-soft)!important;color:var(--teal)!important}

const VERSIONES=[['2.6.3','09 nov 2026','Ingreso de inventario más rápido: Admin y SuperUser ya no tienen que poner usuario y contraseña al registrar un ingreso (temporal, mientras se carga el inventario).'],['2.6.2','09 nov 2026','Ventas hechas con costo 0: el reporte usa el costo actual del artículo, así la ganancia se corrige sola cuando se actualiza el costo.'],['2.6.1','09 nov 2026','El celular puede guardar la contraseña al entrar. La sesión se cierra después de 2 horas sin usar (antes 30 min). ¿Olvidaste tu contraseña? sirve para cualquier usuario, con la clave de activación de la tienda.'],['2.6','09 nov 2026','¿Olvidaste la contraseña del Admin? En el login se puede poner una contraseña nueva al Admin usando la clave de activación de la tienda. Queda registrado en el historial.'],['2.5.3','09 nov 2026','Lista de inventario: botón Editar en cada artículo para poner o cambiar el costo y el precio. Los artículos con costo 0 salen como “Pendiente” y arriba se ve cuántos faltan.'],['2.5.2','07 nov 2026','Descargar inventario general: ahora solo trae los artículos que tienen existencia disponible. La lista completa sigue en Lista de inventario.'],['2.5.1','07 nov 2026','El monto que falta por pagar ahora sale resaltado en un recuadro rojo grande, en pago normal y en pago mixto.'],['2.5','07 nov 2026','Pago mixto: una factura se puede pagar con varias formas a la vez (efectivo en córdobas, efectivo en dólares y transferencias). El cambio siempre en córdobas y el cierre de caja suma cada parte donde corresponde.'],['2.4','07 nov 2026','Eliminar artículos (solo Admin y SuperUser, con usuario y contraseña y comentario obligatorio). Solo se puede eliminar si la existencia está en 0; sus ventas y movimientos se conservan en el historial.'],['2.3','07 nov 2026','Más estabilidad para uso intenso: guarda una copia en el celular para cargar más rápido y aguantar cortes cortos de internet, y gasta mucho menos del plan gratis de Google.'],['2.2','07 nov 2026','Buscador de existencias en Inventario: escribís parte del nombre o el código y ves al instante la existencia, el estado y el precio.'],['2.1','07 nov 2026','Limpiar datos de prueba (solo Admin, con confirmación y contraseña): borra inventario, ventas, clientes, ajustes, historial y usuarios que no son Admin.'],['2.0','07 nov 2026','Sistema propio con Google Firebase: enlace propio sin cuenta de Claude, activación de celulares con clave de tienda, datos en tiempo real.'],['1.1','07 nov 2026','Módulo Respaldo: descarga completa del sistema en un archivo, restauración con autorización de Admin y recordatorio diario en el cierre de caja.'],['1.0.1','07 nov 2026','Carga más rápida: la conexión espera al sistema en vez de fallar, el inicio de sesión hace un solo guardado y la verificación de permisos ya no frena la carga.'],['1.0','07 nov 2026','Primera versión para apertura: inicio de sesión con roles, registro de usuarios, inventario (lista, ingresos, ajustes, reporte, historial e inventario general), facturación con carrito, efectivo y transferencias, cambio en córdobas, clientes, reporte de ventas, cierre de caja con caja chica, reportes en Excel, tema claro/oscuro y seguridad reforzada.']];

async function sha(salt,pw){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const rndSalt=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');
function claveTemporal(){const L='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz',D='23456789',r=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
  let c='';for(let i=0;i<5;i++)c+=L[r(L.length)];for(let i=0;i<4;i++)c+=D[r(D.length)];return c}

const SEG={ingresoSinClave:true,maxIntentos:5,bloqueoMin:15,inactMin:120,maxSesionH:12,iter:100000};

async function pbkdf2(salt,pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return hexDe(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:SEG.iter,hash:'SHA-256'},k,256))}
async function hashClave(salt,pw){return 'p2$'+await pbkdf2(salt,pw)}
async function verificarClave(rec,pw){if(!rec||!rec.hash||!pw)return false;const h=rec.hash.startsWith('p2$')?await hashClave(rec.salt,pw):await sha(rec.salt,pw);
  let d=h.length^rec.hash.length;for(let i=0;i<Math.min(h.length,rec.hash.length);i++)d|=h.charCodeAt(i)^rec.hash.charCodeAt(i);return d===0}
/* token de sesión: se deriva del hash y de una versión; no guarda la contraseña ni el hash en el celular */

const COMUNES=['12345678','123456789','87654321','password','contrasena','contraseña','qwerty123','abc12345','11111111','00000000','12341234','admin123','lulu1234','fannyluu'];
function validarClave(pw,rec){if(pw.length<8)return 'La contraseña debe tener al menos 8 caracteres.';
  if(!/[A-Za-zÁÉÍÓÚÑáéíóúñ]/.test(pw)||!/\d/.test(pw))return 'La contraseña debe tener letras y números.';
  const l=pw.toLowerCase();if(COMUNES.includes(l))return 'Esa contraseña es muy fácil de adivinar. Elegí otra.';
  if(/^(.)\1+$/.test(pw))return 'No uses el mismo carácter repetido.';
  const partes=[rec?.nombre,rec?.apellido,(rec?.usuario||'').split('.')[0]].filter(x=>x&&x.length>=3).map(x=>x.toLowerCase());
  if(partes.some(x=>l.includes(x)))return 'La contraseña no puede contener tu nombre o apellido.';return null}

async function intentoFallido(id,rec,donde){if(!rec){regAcceso('fallo',null,'(desconocido)',{donde});return}

function sigCodigo(){let mx=0;for(const p of S.productos.values()){const m=/^P-(\d+)$/.exec(p.codigo||'');if(m)mx=Math.max(mx,+m[1])}return 'P-'+String(mx+1).padStart(4,'0')}
async function movimiento(p,tipo,cantidad,antes,despues,extra={}){
  try{await S.db.collection('movimientos').add({ts:Date.now(),productoId:p.id,producto:p.nombre,tipo,cantidad,antes,despues,porId:S.sesion.id,porUsuario:yo()?.usuario||'',precio:+p.precio||0,...extra})}catch(e){console.warn('mov',e)}
}

function resultadosStock(){const t=(S.inv.sq||'').trim().toLowerCase();if(!t)return '';
  const marcar=x=>{const i=x.toLowerCase().indexOf(t);return i<0?esc(x):esc(x.slice(0,i))+'<mark>'+esc(x.slice(i,i+t.length))+'</mark>'+esc(x.slice(i+t.length))};
  const l=prodsActivos().filter(p=>p.nombre.toLowerCase().includes(t)||(p.codigo||'').toLowerCase().includes(t)).sort((a,b)=>(b.nombre.toLowerCase().startsWith(t))-(a.nombre.toLowerCase().startsWith(t))||a.nombre.localeCompare(b.nombre,'es')).slice(0,10);
  if(!l.length)return `<p class="hint" style="padding:10px 4px;margin:0">No hay artículos que coincidan con “${esc(S.inv.sq.trim())}”.</p>`;
  return `<div class="card stockres">${l.map(p=>{const [c,lb]=estadoStock(p);return `<button class="srow2" data-prod="${esc(p.id)}"><span class="si"><b>${marcar(p.nombre)}</b><small class="num">${marcar(p.codigo||'')} · ${esc(unidadDe(p))} · ${fmt(p.precio)}${puedeIngreso()&&p.costo!=null?' · costo '+fmt(p.costo):''}</small></span><span class="ss"><b class="num">${stockDe(p)}</b><span class="pill ${c}">${lb}</span></span></button>`}).join('')}</div>`}
function vInventario(){
  const I=S.inv;const todos=prodsActivos();const q=I.q.trim().toLowerCase();
  const cats=['Todas',...new Set(todos.map(p=>p.categoria).filter(Boolean))].sort((a,b)=>a==='Todas'?-1:b==='Todas'?1:a.localeCompare(b,'es'));
  let list=todos.filter(p=>(I.cat==='Todas'||p.categoria===I.cat)&&(!q||p.nombre.toLowerCase().includes(q)||(p.codigo||'').toLowerCase().includes(q)));
  if(I.soloBajos)list=list.filter(p=>stockDe(p)<=minDe(p));
  const unidades=todos.reduce((a,p)=>a+Math.max(0,stockDe(p)),0);
  const valor=todos.reduce((a,p)=>a+Math.max(0,stockDe(p))*(+p.costo||0),0);
  const bajos=todos.filter(p=>stockDe(p)<=minDe(p)).length;
  const pend=S.pendientes.length;
  const ops=[];
  if(puedeIngreso())ops.push(`<button class="op" data-ir="inv-ingreso"><span class="ic">${ICON.ingreso}</span><b>Ingreso de inventario</b><small>Mercadería que llegó</small></button>`);
  if(puedeSolicitar())ops.push(`<button class="op" data-ir="inv-solicitar"><span class="ic">${ICON.solicitar}</span><b>Solicitar ajuste</b><small>Sumar o dar de baja</small></button>`);
  ops.push(`<button class="op" data-abrirlista><span class="ic">${ICON.lista}</span><b>Lista de inventario</b><small>Descripción, unidad y precios</small></button>`);
  if(puedeIngreso())ops.push(`<button class="op" data-abrirrep><span class="ic">${ICON.reporte}</span><b>Reporte de inventario</b><small>Existencias y valores</small></button>`);
  if(puedeIngreso())ops.push(`<button class="op" data-ir="inv-historial"><span class="ic">${ICON.historial}</span><b>Historial de inventario</b><small>Quién movió qué y cuánto</small></button>`);
  if(puedeAplicar())ops.push(`<button class="op" data-ir="inv-aplicar"><span class="ic">${ICON.aplicar}</span><b>Aplicar ajustes</b><small>${pend?pend+' por revisar':'Nada pendiente'}</small>${pend?`<span class="badge">${pend}</span>`:''}</button>`);
  let h=`${atras()}<div class="hello"><h2>Inventario</h2>${puedeIngreso()?'<button class="btn primary sm" data-abrirlista>Lista de inventario</button>':''}</div>
  <div class="stockbox"><input id="stockQ" class="search" type="search" placeholder="Buscar artículo para ver su existencia" value="${esc(S.inv.sq||'')}" autocomplete="off"><div id="stockRes">${resultadosStock()}</div></div>
  ${ops.length?`<div class="ops">${ops.join('')}</div>`:''}`;
  return h;
}

/* selector de producto con búsqueda */
function selectorProducto(id){return `<div class="picker" id="${id}"><input class="search" type="search" placeholder="Escribí el nombre o código del producto" autocomplete="off" data-pq><div class="plist" data-pl hidden></div><div class="psel" data-ps hidden></div></div>`}
function bindSelector(root,onPick,preId){
  const q=root.querySelector('[data-pq]'),pl=root.querySelector('[data-pl]'),ps=root.querySelector('[data-ps]');
  const marcar=(txt,t)=>{const i=txt.toLowerCase().indexOf(t);return i<0?esc(txt):esc(txt.slice(0,i))+'<mark>'+esc(txt.slice(i,i+t.length))+'</mark>'+esc(txt.slice(i+t.length))};
  const draw=()=>{const t=q.value.trim().toLowerCase();if(!t){pl.hidden=true;pl.innerHTML='';return}pl.hidden=false;
    const l=prodsActivos().filter(p=>p.nombre.toLowerCase().includes(t)||(p.codigo||'').toLowerCase().includes(t)).sort((a,b)=>(b.nombre.toLowerCase().startsWith(t))-(a.nombre.toLowerCase().startsWith(t))||a.nombre.localeCompare(b.nombre,'es')).slice(0,8);
    pl.innerHTML=l.length?l.map(p=>`<button type="button" data-pick="${esc(p.id)}"><span>${marcar(p.nombre,t)}<small class="num">${marcar(p.codigo||'',t)}</small></span><span class="num">${stockDe(p)} u</span></button>`).join(''):'<p class="hint" style="padding:10px 12px;margin:0">No hay productos que coincidan con “'+esc(q.value.trim())+'”.</p>'};
  const pick=id=>{const p=S.productos.get(id);if(!p)return;q.hidden=true;pl.hidden=true;ps.hidden=false;
    ps.innerHTML=`<span><b>${esc(p.nombre)}</b><small class="num">${esc(p.codigo||'')} · Existencia actual: ${stockDe(p)}</small></span><button type="button" class="btn sm ghost" data-unpick>Cambiar</button>`;onPick(p)};
  q.addEventListener('input',draw);pl.addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(b)pick(b.dataset.pick)});
  ps.addEventListener('click',e=>{if(e.target.closest('[data-unpick]')){q.hidden=false;ps.hidden=true;q.value='';draw();onPick(null);q.focus()}});
  draw();if(preId)pick(preId);
}

  <div class="card" style="padding:16px"><form id="ingf" class="form" autocomplete="off">
   <div class="full"><p class="lbl">Producto</p>${selectorProducto('ingSel')}<button type="button" class="linkbtn" data-nuevoprod="ingreso">¿No está en la lista? Agregalo aquí</button></div>
   <label class="f">Fecha de ingreso<input id="ingFec" type="date" required value="${hoyKey()}" max="${hoyKey()}"></label>
   <label class="f">Cantidad a ingresar<input id="ingCant" type="number" inputmode="numeric" min="1" step="1" required></label>
   <label class="f full">Comentario <span class="req">obligatorio</span><textarea id="ingCom" rows="2" maxlength="200" required placeholder="¿Por qué se ingresa? Ej: Llegó el pedido del proveedor de rosquillas"></textarea></label>
   <div class="full resumen" id="ingRes" hidden></div>
   <p class="err full" id="ingErr" hidden></p>
   <div class="actions full" style="margin-top:0"><button class="btn primary" type="submit">Registrar ingreso</button></div></form></div>
  <p class="hint" style="margin-top:14px">Los ingresos registrados se ven en <b>Historial de inventario</b>.</p>`;
}
function listaIngresos(){const rec=S.inv.ultIngresos;return rec==null?'<div class="empty"><b>Cargando…</b></div>':rec.length?`<div class="card">${rec.map(m=>`<div class="mrow"><span class="mt in">+${m.cantidad}</span><span class="mn">${esc(m.producto)}<small>${esc(fechaHora(m.ts))} · ${esc(m.porUsuario)}${m.nota?' · '+esc(m.nota):''}</small></span><span class="num hint">${m.antes} → ${m.despues}</span></div>`).join('')}</div>`:'<p class="hint">Todavía no hay ingresos registrados.</p>';
}
function montarIngreso(){const f=$('#ingf');if(!f||f.dataset.b)return;f.dataset.b=1;let sel=null;
  const res=()=>{const r=$('#ingRes');const c=parseInt($('#ingCant').value,10);if(!sel||!(c>0)){r.hidden=true;return}r.hidden=false;r.innerHTML=`Existencia de <b>${esc(sel.nombre)}</b>: <span class="num">${stockDe(sel)} → <b>${stockDe(sel)+c}</b></span>`};
  bindSelector($('#ingSel'),p=>{sel=p;res();if(p)setTimeout(()=>$('#ingCant').focus(),50)},S.inv.preProd);S.inv.preProd=null;
  $('#ingCant').addEventListener('input',res);
  f.addEventListener('submit',async e=>{e.preventDefault();const err=$('#ingErr');const c=parseInt($('#ingCant').value,10);
    if(!sel){err.textContent='Elegí el producto.';err.hidden=false;return} if(!(c>0)){err.textContent='Escribí una cantidad mayor que cero.';err.hidden=false;return}
    const com=$('#ingCom').value.trim();if(com.length<10){err.textContent='Escribí un comentario que explique el ingreso (mínimo 10 letras).';err.hidden=false;$('#ingCom').focus();return}
    const fec=$('#ingFec').value;if(!fec){err.textContent='Elegí la fecha de ingreso.';err.hidden=false;return}if(fec>hoyKey()){err.textContent='La fecha de ingreso no puede ser futura.';err.hidden=false;return}
    err.hidden=true;const p0=S.productos.get(sel.id);const a0=stockDe(p0);
    (SEG.ingresoSinClave&&['admin','superuser'].includes(rol())?o=>o.ok():pedirCredenciales)({
      titulo:'¿Estás seguro de registrar este ingreso?',
      aviso:`Se van a ingresar <b class="num">${c}</b> ${esc(unidadDe(p0).toLowerCase())}${c===1?'':'(s)'} de <b>${esc(p0.nombre)}</b> con fecha <b>${esc(fechaCorta(fec))}</b>. La existencia pasa de <b class="num">${a0}</b> a <b class="num">${a0+c}</b>.<br>Comentario: <i>“${esc(com)}”</i><br> Para confirmar, escribí tu usuario y contraseña.`,
      boton:'Sí, registrar ingreso',
      valida:u=>u.id===S.sesion.id,
      errorTxt:'Usuario o contraseña incorrectos. Escribí los datos con los que entraste.',
      ok:async()=>{const p=S.productos.get(sel.id);if(!p)return toast('El producto ya no existe');const antes=stockDe(p);
        const btn=f.querySelector('[type=submit]');btn.disabled=true;
        try{await S.db.doc('productos/'+p.id).update({stock:(+p.stock||0)+c,actualizado:Date.now()});await movimiento(p,'ingreso',c,antes,antes+c,{fecha:fec,nota:com});
          toast('Ingreso registrado: +'+c+' '+p.nombre);document.activeElement?.blur();$('#view').innerHTML='';S._last=null;cargarIngresos();render()}
        catch(e2){err.textContent='No se pudo guardar. Revisá tu internet.';err.hidden=false;btn.disabled=false}}
    });});
}
async function cargarIngresos(){try{const s=await S.db.collection('movimientos').where('tipo','==','ingreso').orderBy('ts','desc').limit(15).get();S.inv.ultIngresos=s.docs.map(d=>d.data())}catch(e){S.inv.ultIngresos=[]}const l=$('#ingList');if(l)l.innerHTML=listaIngresos()}

/* ---- Solicitar ajuste ---- */
function vSolicitar(){
    return `${atras('inventario','← Inventario')}<h2>Solicitar ajuste de inventario</h2>
  <div class="card" style="padding:16px"><form id="solf" class="form" autocomplete="off">
   <div class="full"><p class="lbl">Producto</p>${selectorProducto('solSel')}</div>
   <div class="full"><p class="lbl">¿Qué necesitás?</p><div class="seg2"><button type="button" data-tipo="sumar" aria-pressed="false"><b>+ Sumar</b><small>Hay más de lo que dice el sistema</small></button><button type="button" data-tipo="baja" aria-pressed="false"><b>− Dar de baja</b><small>Hay menos o no se puede vender</small></button></div></div>
   <label class="f">Cantidad<input id="solCant" type="number" inputmode="numeric" min="1" step="1" required></label>
   <label class="f">Motivo<select id="solMot" required><option value="">Elegí primero sumar o dar de baja</option></select></label>
   <label class="f full">Comentario <span class="req">obligatorio</span><textarea id="solNota" rows="3" maxlength="240" required placeholder="Explicá qué pasó. Ej: Se quebraron 2 rosquillas al bajar la caja de la estantería"></textarea></label>
   <div class="full resumen" id="solRes" hidden></div>
   <p class="err full" id="solErr" hidden></p>
   <div class="actions full" style="margin-top:0"><button class="btn primary" type="submit">Enviar solicitud</button></div></form></div>
  <h3>Mis solicitudes</h3><div id="solList">${listaMias()}</div>`;
}
function listaMias(){const mias=S.inv.misSolicitudes;return mias==null?'<div class="empty"><b>Cargando…</b></div>':mias.length?`<div class="card">${mias.map(filaAjuste).join('')}</div>`:'<p class="hint">Todavía no has enviado solicitudes.</p>';
}
const ESTADOS={pendiente:['low','Pendiente'],aplicado:['ok','Aplicado'],rechazado:['out','Rechazado']};
function filaAjuste(a){const [c,l]=ESTADOS[a.estado]||['','?'];
  return `<button class="mrow" data-ajuste="${esc(a.id)}"><span class="mt ${a.tipo==='sumar'?'in':'outm'}">${a.tipo==='sumar'?'+':'−'}${a.cantidad}</span><span class="mn">${esc(a.producto)}<small>${esc(a.motivo)} · ${esc(fechaHora(a.ts))}${a.solicitadoUsuario&&S.vista!=='inv-solicitar'?' · '+esc(a.solicitadoUsuario):''}</small></span><span class="pill ${c}">${l}</span></button>`}
function montarSolicitar(){const f=$('#solf');if(!f||f.dataset.b)return;f.dataset.b=1;let sel=null,tipo=null;
  const res=()=>{const r=$('#solRes');const c=parseInt($('#solCant').value,10);if(!sel||!tipo||!(c>0)){r.hidden=true;return}const s=stockDe(sel);const n=tipo==='sumar'?s+c:s-c;r.hidden=false;
    r.innerHTML=`Si se aprueba, <b>${esc(sel.nombre)}</b> quedaría en <span class="num">${s} → <b>${n}</b></span>${n<0?'<br><span class="err" style="animation:none">No puede quedar en negativo.</span>':''}`};
  bindSelector($('#solSel'),p=>{sel=p;res()},S.inv.preProd);S.inv.preProd=null;
  f.querySelector('.seg2').addEventListener('click',e=>{const b=e.target.closest('[data-tipo]');if(!b)return;tipo=b.dataset.tipo;f.querySelectorAll('[data-tipo]').forEach(x=>x.setAttribute('aria-pressed',x===b));
    $('#solMot').innerHTML='<option value="">Elegí el motivo</option>'+MOTIVOS[tipo].map(m=>`<option>${esc(m)}</option>`).join('');res()});
  $('#solCant').addEventListener('input',res);
  f.addEventListener('submit',async e=>{e.preventDefault();const err=$('#solErr');const c=parseInt($('#solCant').value,10),mot=$('#solMot').value,nota=$('#solNota').value.trim();
    const fail=m=>{err.textContent=m;err.hidden=false};
    if(!sel)return fail('Elegí el producto.');if(!tipo)return fail('Elegí si es para sumar o dar de baja.');if(!(c>0))return fail('Escribí una cantidad mayor que cero.');
    if(!mot)return fail('Elegí el motivo.');if(nota.length<10){$('#solNota').focus();return fail('Escribí un comentario que explique qué pasó (mínimo 10 letras). El Admin lo necesita para aprobar.')}
    if(tipo==='baja'&&c>stockDe(sel))return fail('No se puede dar de baja más de lo que hay ('+stockDe(sel)+').');
    err.hidden=true;const sp=sel;
    (async()=>{const btn=f.querySelector('[type=submit]');btn.disabled=true;
        try{await S.db.collection('ajustes').add({ts:Date.now(),productoId:sp.id,producto:sp.nombre,tipo,cantidad:c,motivo:mot,nota,estado:'pendiente',stockAlSolicitar:stockDe(sp),solicitadoPor:S.sesion.id,solicitadoUsuario:yo()?.usuario||''});
          toast('Solicitud enviada. Un Admin o SuperUser la revisará.');document.activeElement?.blur();$('#view').innerHTML='';S._last=null;cargarMisSolicitudes();render()}
        catch(e2){fail('No se pudo enviar. Revisá tu internet.');btn.disabled=false}})();});
}
async function cargarMisSolicitudes(){try{const s=await S.db.collection('ajustes').where('solicitadoPor','==',S.sesion.id).orderBy('ts','desc').limit(30).get();S.inv.misSolicitudes=s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){S.inv.misSolicitudes=[]}const l=$('#solList');if(l)l.innerHTML=listaMias()}

/* ---- Aplicar ajustes ---- */
function vAplicar(){const I=S.inv;
  let h=`${atras('inventario','← Inventario')}<h2>Aplicar ajustes</h2>
  <div class="chips"><button class="chip" data-atab="pendiente" aria-pressed="${I.atab==='pendiente'}">Pendientes (${S.pendientes.length})</button><button class="chip" data-atab="aplicado" aria-pressed="${I.atab==='aplicado'}">Aplicados</button><button class="chip" data-atab="rechazado" aria-pressed="${I.atab==='rechazado'}">Rechazados</button></div>`;
  if(I.atab!=='pendiente'){if(!I.adesde){const x=new Date();x.setDate(x.getDate()-29);I.adesde=diaKey(x);I.ahasta=diaKey(new Date())}h+=filtroFechas('aj',I.adesde,I.ahasta)+'<div style="height:12px"></div>'}
  if(I.atab==='pendiente'){const l=S.pendientes.slice().sort((a,b)=>a.ts-b.ts);
    if(!l.length)return h+`<div class="empty"><b>No hay ajustes pendientes</b>Cuando alguien solicite sumar o dar de baja un producto, aparecerá aquí para que lo revisés.</div>`;
    return h+l.map(a=>{const p=S.productos.get(a.productoId);const s=p?stockDe(p):0;const n=a.tipo==='sumar'?s+a.cantidad:s-a.cantidad;
      return `<div class="adj"><div class="adj-h"><span class="mt ${a.tipo==='sumar'?'in':'outm'}">${a.tipo==='sumar'?'+':'−'}${a.cantidad}</span><div style="min-width:0;flex:1"><b>${esc(a.producto)}</b><small>${a.tipo==='sumar'?'Sumar':'Dar de baja'} · ${esc(a.motivo)}</small></div></div>
      <div class="adj-c"><span>Comentario de <b>${esc(a.solicitadoUsuario)}</b></span><p>${a.nota?esc(a.nota):'<i>Sin comentario</i>'}</p></div>
      <div class="adj-m"><span>Solicitó <b>${esc(a.solicitadoUsuario)}</b> · ${esc(fechaHora(a.ts))}</span><span class="num">Existencia: ${s} → <b class="${n<0?'neg':''}">${n}</b></span></div>
      ${!p?'<p class="err" style="animation:none">Este producto ya no existe.</p>':n<0?'<p class="err" style="animation:none">No se puede aplicar: la existencia quedaría en negativo.</p>':''}
      <div class="actions" style="margin-top:12px"><button class="btn danger sm" data-rechazar="${esc(a.id)}">Rechazar</button><button class="btn primary sm" data-aplicar="${esc(a.id)}" ${!p||n<0?'disabled':''}>Aplicar ajuste</button></div></div>`}).join('');
  }
  const l=I.resueltos;if(l==null)return h+'<div class="empty"><b>Cargando…</b></div>';
  if(!l.length)return h+`<div class="empty"><b>Nada por aquí</b></div>`;
  return h+`<div class="card">${l.map(a=>`<button class="mrow" data-ajuste="${esc(a.id)}"><span class="mt ${a.tipo==='sumar'?'in':'outm'}">${a.tipo==='sumar'?'+':'−'}${a.cantidad}</span><span class="mn">${esc(a.producto)}<small>${esc(a.motivo)} · pidió ${esc(a.solicitadoUsuario)} · ${a.estado==='aplicado'?'aplicó':'rechazó'} ${esc(a.resueltoUsuario||'')}</small></span><span class="hint num" style="font-size:12.5px">${esc(fechaHora(a.resueltoTs||a.ts))}</span></button>`).join('')}</div>`;
}
async function cargarResueltos(){S.inv.resueltos=null;render();try{const I=S.inv;if(!I.adesde){const x=new Date();x.setDate(x.getDate()-29);I.adesde=diaKey(x);I.ahasta=diaKey(new Date())}const s=await S.db.collection('ajustes').where('estado','==',I.atab).where('resueltoTs','>=',msIni(I.adesde)).where('resueltoTs','<',msFin(I.ahasta)).orderBy('resueltoTs','desc').limit(300).get();S.inv.resueltos=s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){S.inv.resueltos=[]}if(S.vista==='inv-aplicar')render()}
async function aplicarAjuste(id){const a=S.pendientes.find(x=>x.id===id);const p=a&&S.productos.get(a.productoId);if(!a||!p)return;
  const antes=stockDe(p);const delta=a.tipo==='sumar'?a.cantidad:-a.cantidad;if(antes+delta<0)return toast('La existencia quedaría en negativo');
  pedirCredenciales({titulo:'¿Estás seguro de aplicar este ajuste?',
    aviso:`Se va a <b>${a.tipo==='sumar'?'sumar':'dar de baja'} <span class="num">${a.cantidad}</span></b> de <b>${esc(a.producto)}</b>, solicitado por <b>${esc(a.solicitadoUsuario)}</b>.<br>Motivo: <b>${esc(a.motivo)}</b>${a.nota?`<br>Comentario: <i>“${esc(a.nota)}”</i>`:''}<br>La existencia pasa de <b class="num">${antes}</b> a <b class="num">${antes+delta}</b>. Para confirmar, escribí tu usuario y contraseña.`,
    boton:'Sí, aplicar ajuste',valida:u=>u.id===S.sesion.id,errorTxt:'Usuario o contraseña incorrectos. Escribí los datos con los que entraste.',ok:()=>aplicarOk(id)});
}
async function aplicarOk(id){const a=S.pendientes.find(x=>x.id===id);const p=a&&S.productos.get(a.productoId);if(!a||!p)return closeModal();
  const antes=stockDe(p);const delta=a.tipo==='sumar'?a.cantidad:-a.cantidad;
  try{await S.db.doc('ajustes/'+id).update({estado:'aplicado',resueltoPor:S.sesion.id,resueltoUsuario:yo()?.usuario||'',resueltoTs:Date.now(),stockAntes:antes,stockDespues:antes+delta});
    await S.db.doc('productos/'+p.id).update({stock:(+p.stock||0)+delta,actualizado:Date.now()});
    await movimiento(p,a.tipo==='sumar'?'ajuste+':'ajuste-',delta,antes,antes+delta,{motivo:a.motivo,nota:a.nota||'',solicitadoUsuario:a.solicitadoUsuario,ajusteId:id});

/* ---- Reporte de inventario ---- */
const diaKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
async function descargar(nombre,filas){
  const q=v=>{const t=String(v??'');return /[",\n;]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
  const csv='﻿'+filas.map(r=>r.map(q).join(',')).join('\r\n');

  try{await S.dl.save({filename:nombre,data:csv});toast('Reporte descargado')}catch(e){if(e?.code!=='declined')toast('No se pudo descargar el reporte')}
}
/* ---------- filtro de fechas reutilizable (Desde / Hasta) ---------- */
const kDia=d=>diaKey(d);
function atajosFecha(){const d=new Date();const h=kDia(d);const menos=n=>{const x=new Date();x.setDate(x.getDate()-n);return kDia(x)};
  const ini=kDia(new Date(d.getFullYear(),d.getMonth(),1));const pi=kDia(new Date(d.getFullYear(),d.getMonth()-1,1)),pf=kDia(new Date(d.getFullYear(),d.getMonth(),0));
  return [['inicio','Desde el inicio',fechaInicio(),h],['hoy','Hoy',h,h],['7','Últimos 7 días',menos(6),h],['mes','Este mes',ini,h],['pasado','Mes pasado',pi,pf]]}
/* primera fecha con datos: el producto o usuario más antiguo */
function fechaInicio(){let min=Date.now();for(const p of S.productos.values()){if(p.creado&&p.creado<min)min=p.creado;if(p.fechaRegistro&&msIni(p.fechaRegistro)<min)min=msIni(p.fechaRegistro)}
  for(const u of Object.values(S.usuarios))if(u.creado&&u.creado<min)min=u.creado;return kDia(new Date(min))}
function filtroFechas(px,desde,hasta){const h=kDia(new Date());
  return `<div class="ffechas"><div class="fpar"><label class="f">Desde<input type="date" id="${px}Desde" value="${esc(desde)}" max="${h}"></label><label class="f">Hasta<input type="date" id="${px}Hasta" value="${esc(hasta)}" max="${h}"></label></div>
  <div class="chips" style="margin:8px 0 0">${atajosFecha().map(([k,l,a,b])=>`<button type="button" class="chip" data-rq="${px}:${k}" aria-pressed="${desde===a&&hasta===b}">${l}</button>`).join('')}</div></div>`}
const msIni=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).getTime()};
const msFin=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d+1).getTime()};
const diaEf=m=>m.fecha||kDia(new Date(m.ts));
function fijarRango(px,a,b){if(b<a)b=a;
  if(px==='rep'){S.rep.desde=a;S.rep.hasta=b;cargarRepMovs()}
  else if(px==='hi'){S.hinv.desde=a;S.hinv.hasta=b;S.hinv.aplicado=false;S.hinv.texto=$('#hiQ')?.value||S.hinv.texto;$('#view').innerHTML='';render()}
  else if(px==='rv'){S.rv.desde=a;S.rv.hasta=b;cargarRV()}
  else if(px==='aj'){S.inv.adesde=a;S.inv.ahasta=b;cargarResueltos()}}

/* ---- Reporte de inventario por período ---- */
async function cargarRepMovs(){const R=S.rep;R.movs=null;refrescarReporte();
  try{const s=await S.db.collection('movimientos').where('ts','>=',msIni(R.desde)).orderBy('ts','asc').limit(1000).get();R.movs=s.docs.map(d=>d.data());R.lleno=s.size>=1000}
  catch(e){R.movs=[];toast('No se pudieron cargar los movimientos')}refrescarReporte()}
function periodoDe(p){const R=S.rep;let desp=0,ing=0,ven=0,aj=0;
  for(const m of (R.movs||[])){if(m.productoId!==p.id)continue;const k=diaEf(m),c=+m.cantidad||0;
    if(k>R.hasta){desp+=c;continue}if(k<R.desde)continue;
    if(m.tipo==='ingreso')ing+=c;else if(m.tipo==='venta')ven+=-c;else aj+=c}
  const fin=stockDe(p)-desp,ini=fin-ing+ven-aj;
  const est=fin<=0?['out','Agotado']:fin<=minDe(p)?['low','Bajo']:['ok','OK'];
  return {ini,ing,ven,aj,fin,est}}
function filasReporte(){const R=S.rep;
  let l=prodsActivos().map(p=>({p,...periodoDe(p)}));
  if(R.est!=='todos')l=l.filter(x=>x.est[0]===R.est);
  const k={nombre:(a,b)=>a.p.nombre.localeCompare(b.p.nombre,'es'),exist:(a,b)=>a.fin-b.fin,valor:(a,b)=>b.fin*(+b.p.costo||0)-a.fin*(+a.p.costo||0),vendido:(a,b)=>b.ven-a.ven}[R.orden]||((a,b)=>a.p.nombre.localeCompare(b.p.nombre,'es'));
  return l.sort(k)}
